<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0
Projects — Infinite Brain original template
infinitebrain-template-id: ib-projects
How to personalize: Keep Markdown notes as the source of truth. Use the optional
Infinite Brain SDK (vault, notes, properties, state and app) for readable vault data.
Adjust the inline styles and sample notes to suit the vault; keep Sample badges until
real SDK results replace them. Never add network requests or browser storage.
-->
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projects · Infinite Brain</title>
<style>*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--accent,var(--tone));outline-offset:4px}button{text-align:left}h1,h2,h3,p{margin:0}button,section,article,div{min-width:0}h1,h2,h3,.note-title{overflow-wrap:anywhere}.muted{color:var(--secondary)}.sample{display:inline-block;border:1px solid var(--line);padding:2px 8px;border-radius:20px;font:600 10px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.04em;color:var(--ink);background:var(--card)}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}#notice{font:12px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--secondary);margin-top:16px}.empty{padding:24px 8px;color:var(--secondary)}footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:16px;justify-content:space-between;font-size:11px;color:var(--secondary)}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,box-shadow .15s,transform .15s}button:hover{transform:translateY(-1px)}}
:root{--tone:#1f9d6b;--tone-2:#f0a32b;--page:#f2f8f4;--ink:#17382c;--secondary:#536b5d;--line:#d8e5dc;--card:#fff;--wash:#e4f1e9;--green-text:#176544;--amber-text:#795013;--shadow:0 3px 8px #17382c05,0 14px 28px #17382c04}
html[data-theme="dark"]{--page:#101e18;--ink:#e5f2e9;--secondary:#afc5b6;--line:#344d40;--card:#1c2e24;--wash:#263e30;--green-text:#8fe1b8;--amber-text:#f5cb85;--shadow:0 6px 20px #0002}
@media(prefers-color-scheme:dark){html:not([data-theme]){--page:#101e18;--ink:#e5f2e9;--secondary:#afc5b6;--line:#344d40;--card:#1c2e24;--wash:#263e30;--green-text:#8fe1b8;--amber-text:#f5cb85;--shadow:0 6px 20px #0002}}
main{max-width:1440px;margin:auto;padding:38px 44px}.brand{display:flex;align-items:center;gap:10px;color:var(--secondary);margin-bottom:38px}.brand svg{color:var(--tone)}.topline{display:flex;justify-content:space-between;gap:20px;align-items:flex-end}h1{font-size:clamp(34px,5vw,48px);font-weight:650;line-height:1.12;letter-spacing:-.045em}.intro{margin-top:12px;color:var(--secondary);font-size:15px}.summary{display:flex;align-items:center;gap:10px;font-size:12px;white-space:nowrap}.summary:before{content:'';height:7px;width:7px;border-radius:50%;background:var(--tone)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:30px 0 22px;border-bottom:1px solid var(--line);padding-bottom:15px}.view{display:flex;align-items:center;gap:8px;font-weight:650}.view svg{color:var(--green-text)}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}.column{padding:16px 12px 12px;background:var(--wash);border:1px solid var(--line);border-radius:22px}.column-head{display:flex;align-items:center;gap:9px;padding:0 7px 16px}.column-head:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--tone)}.column:nth-child(2) .column-head:before{background:var(--tone-2)}.column:nth-child(3) .column-head:before{background:var(--green-text)}.column h2{font-size:13px;font-weight:650}.count{margin-left:auto;font-size:11px;border:1px solid var(--line);padding:0 7px;border-radius:7px}.project{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px 18px;margin-bottom:11px;box-shadow:var(--shadow)}.project:hover{box-shadow:0 5px 18px #17382c14}.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:22px}.doc-mark{width:30px;height:33px;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center;color:var(--green-text)}.doc-mark svg{width:16px;height:16px}.project h3{font-size:16px;font-weight:620;letter-spacing:-.02em;line-height:1.35;margin-bottom:13px}.tags{display:flex;flex-wrap:wrap;gap:5px;min-height:23px}.tag{font-size:10px;color:var(--green-text);background:var(--wash);padding:3px 8px;border-radius:6px;overflow-wrap:anywhere}.project small{display:block;font-size:10px;color:var(--secondary);border-top:1px solid var(--line);padding-top:13px;margin-top:16px}.column-bottom{font-size:10px;text-align:center;padding:5px;color:var(--secondary)}footer span:last-child{color:var(--green-text)}@media(max-width:760px){main{padding:25px 20px}.brand{margin-bottom:30px}.topline{display:block}.summary{margin-top:20px}.board{grid-template-columns:1fr}.toolbar{margin-top:25px}.project{padding:18px}.card-top{margin-bottom:15px}footer{flex-direction:column;gap:5px}}
</style></head><body><main>
<div class="brand"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 16V8h6v8H4Zm10 4V4h6v16h-6Z" stroke="currentColor" stroke-width="1.6" rx="2"/></svg><span class="eyebrow">Infinite Brain / Workbench</span></div>
<header class="topline"><div><h1>Room to make progress.</h1><p class="intro">From the first spark to the last detail. Your projects, in view.</p></div><div class="summary" id="summary"></div></header>
<div class="toolbar"><span class="view"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1" y="2" width="4" height="12" rx="1" stroke="currentColor"/><rect x="7" y="2" width="3" height="8" rx="1" stroke="currentColor"/><rect x="12" y="2" width="3" height="10" rx="1" stroke="currentColor"/></svg>Project board</span><span class="muted" id="group-label">Grouped by status</span></div>
<div class="board" id="board"></div><p id="notice" role="status" aria-live="polite"></p>
<footer><span>Notes first. Progress follows.</span><span id="footer-mode">A little inspiration for your next project</span></footer></main><script src="/__infinitebrain/sdk.js"></script><script>
const $=id=>document.getElementById(id);
let live=false;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function openNote(note){if(!live||!window.infinitebrain)return;Promise.resolve().then(()=>infinitebrain.app.open({path:note.path})).catch(()=>{$('notice').textContent='This note could not be opened. Please try again.';});}
function date(note){const n=Number(note.mtime);if(!Number.isFinite(n)||n<=0)return 'Date unavailable';const d=new Date(n<1e12?n*1000:n);return Number.isNaN(d.getTime())?'Date unavailable':d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function props(note){try{return JSON.parse(note.frontmatter||'{}')||{};}catch{return {};}}
function title(note){return note.title||note.path.split('/').pop().replace(/\.[^.]+$/,'');}
function badge(){const n=el('span','sample','Sample');return n;}

const mark='<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 2h5l3 3v9H4V2Zm4 0v4h4M6 9h4M6 11h3" stroke="currentColor" stroke-linejoin="round"/></svg>';
const samples=[['A calmer onboarding','In progress',['design','experience'],'Projects/Onboarding.md'],['The field notes collection','In progress',['writing'],'Projects/Field notes.md'],['A place for good ideas','Up next',['research','exploration'],'Projects/Ideas.md'],['Make search feel effortless','Up next',['product'],'Projects/Search.md'],['A shared writing ritual','Complete',['team','practice'],'Projects/Writing.md'],['The small details matter','Complete',['craft'],'Projects/Details.md']].map(([title,status,tags,path],i)=>({title,path,tags,frontmatter:JSON.stringify({status}),mtime:Date.now()-i*86400000}));
function render(notes,values,sample){const board=$('board');board.replaceChildren();const byStatus=values.length>0;const groups=new Map(values.map(v=>[v,[]]));for(const note of notes){const status=props(note).status;const value=Array.isArray(status)?status[0]:status;const key=byStatus?(value===undefined||value===null||value===''?'Unspecified':String(value)):(note.path.includes('/')?note.path.split('/')[0]:'Vault root');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(note);}$('group-label').textContent=byStatus?'Grouped by status':'Grouped by folder';$('summary').replaceChildren(el('span','',notes.length+' notes in view'));if(sample)$('summary').append(badge());board.style.gridTemplateColumns=matchMedia('(max-width:760px)').matches?'1fr':`repeat(${Math.min(3,Math.max(1,groups.size))},minmax(0,1fr))`;for(const [name,items] of groups){const section=el('section','column');const head=el('div','column-head');head.append(el('h2','',name),el('span','count',items.length));section.append(head);for(const note of items){const b=el('button','project');b.type='button';const top=el('div','card-top');const icon=el('span','doc-mark');icon.innerHTML=mark;top.append(icon);if(sample)top.append(badge());b.append(top,el('h3','',title(note)));const tags=el('div','tags');for(const tag of (note.tags||[]).slice(0,4))tags.append(el('span','tag','#'+tag.replace(/^#/,'')));b.append(tags,el('small','','Edited '+date(note)));b.addEventListener('click',()=>openNote(note));section.append(b);}section.append(el('div','column-bottom',items.length?items.length+' '+(items.length===1?'note':'notes'):'No notes in this status'));board.append(section);}if(!notes.length)board.append(el('p','empty','No project notes yet. Add a status property or organize notes into folders.'));}
render(samples,['Up next','In progress','Complete'],true);
window.addEventListener('resize',()=>{const board=$('board');board.style.gridTemplateColumns=matchMedia('(max-width:760px)').matches?'1fr':`repeat(${Math.min(3,Math.max(1,board.querySelectorAll('.column').length))},minmax(0,1fr))`;});
(async()=>{const sdk=window.infinitebrain;if(!sdk)return;try{await sdk.ready}catch{return}try{const [notes,values]=await Promise.all([sdk.notes.list({sort:'modified-desc',limit:100}),sdk.properties.values('status')]);if(!notes.length){$('notice').textContent='No notes found yet. Showing sample projects.';return;}render(notes,values,false);live=true;$('footer-mode').textContent='Connected to your vault · up to 100 notes';}catch{$('notice').textContent='Vault data is unavailable. Showing sample projects.';}})();
</script></body></html>
