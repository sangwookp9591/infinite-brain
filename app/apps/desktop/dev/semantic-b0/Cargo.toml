[package]
name = "semantic_b0"
version = "0.1.0"
edition = "2021"

[dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["metal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
