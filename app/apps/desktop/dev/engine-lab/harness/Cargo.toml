# SPDX-License-Identifier: Apache-2.0
[package]
name = "ib-engine-harness"
version = "0.1.0"
edition = "2021"
[workspace]
[lib]
name = "ib_llama"
path = "llama_adapter.rs"
crate-type = ["cdylib", "rlib"]
[[bin]]
name = "runner"
path = "runner.rs"
[[bin]]
name = "oracle"
path = "oracle.rs"
[dependencies]
libloading = "=0.8.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
llama-cpp-2 = { git = "https://github.com/willsheldon/llama-cpp-rs", rev = "cb98c630d0fec934a8a379db4fd63cd3622f6984", default-features = false, features = ["metal", "mtmd"] }

# Xcode 27/dyld rejects Rust 1.94's stripped LINKEDIT string pool (rust#157750).
[profile.release.package.ib-engine-harness]
debug = 1
strip = "none"
