[package]
name = "desktop"
version = "0.2.3"
description = "Infinite Brain — local-first markdown app"
authors = ["Infinite Brain"]
license = "Apache-2.0"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique so it doesn't conflict with the
# bin name (an issue on Windows — see rust-lang/cargo#8519).
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
# Native clipboard writes, dispatched to the main thread by `clipboard.rs`
# (NSPasteboard is not thread-safe; the clipboard plugin wrote it off-main).
arboard = { version = "3", features = ["wayland-data-control"] }
# Frontend logging: `console.log` in a WKWebView never reaches the `tauri dev`
# terminal, so the UI reports through this plugin's Stdout target instead.
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "8"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
# Already resolved transitively; native Ed25519 and canonical base64url IPC.
ring = "=0.17.14"
base64 = "=0.22.1"
# Same rustls verifier already in the tree; check pinned certificate validity/EKU.
webpki = { package = "rustls-webpki", version = "=0.103.15", features = ["ring"] }
walkdir = "2"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
once_cell = "1"
# Move a deleted local-workspace folder to the OS trash (recoverable) rather than
# hard-deleting it — the on-disk `.md` files are the only copy of a local vault.
trash = "5"
# OS keychain for session tokens (spec 04 §7). keyring 3 has NO default store:
# every platform's backend must be named as a feature or that platform silently
# falls back to the in-memory `mock` store, so the session token dies with the
# process and the app starts signed out on every launch (#136, #129).
#   apple-native        → macOS Security framework / Keychain
#   windows-native      → Windows Credential Manager
#   sync-secret-service → Linux D-Bus Secret Service (gnome-keyring / KWallet),
#     the only Linux store that survives a reboot — `linux-native` (kernel
#     keyutils) is per-boot memory, so it is not a substitute.
#   crypto-rust         → encrypt the Secret Service D-Bus session with pure
#     Rust rather than plaintext or a system OpenSSL.
# sync-secret-service links libdbus, so Linux CI installs libdbus-1-dev (both
# release workflows) and Linux users need libdbus-1-3 — present on every desktop
# install that has a Secret Service at all.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
tauri-plugin-deep-link = "2.4.9"
# Text extraction from OOXML containers (`extract.rs`): a `.docx`/`.xlsx`/
# `.pptx` is a ZIP of XML parts, so these two crates are the whole toolchain.
# `default-features = false` on purpose: zip's defaults pull bzip2/zstd/lzma
# (C toolchains on four release targets) and AES, none of which an OOXML part
# uses — Office writes deflate. Both MIT.
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
# Attachment transport (`attachments.rs`): bytes move through Rust, not the
# webview — no bucket CORS, no `connect-src` to widen for a self-hosted MinIO,
# and a 500 MB video never enters the JS heap.
#
# reqwest is ALREADY in the tree via `tauri-plugin-updater`; these are exactly
# the features it already turns on (`cargo tree -i reqwest -e features`:
# json/stream/rustls-no-provider), so this is the same single copy rather than a
# second one. `default-features = false` is load-bearing — reqwest's defaults
# pull native-tls/openssl, which nothing here builds today. `stream` is what
# lets a request body be a file read incrementally instead of a Vec.
#
# `rustls-no-provider` means the crypto provider is NOT chosen by a crate
# feature: rustls 0.23 requires one to be INSTALLED as the process default
# before any `ClientConfig` is built, and with no install `Client::builder()
# .build()` panics ("No rustls crypto provider is configured"). The updater
# installs its own on its own path, so `attachments.rs` installs ring once next
# to its shared client — see the comment there. `rustls` is therefore a direct
# dependency, pinned to the SAME 0.23 the tree already resolves (verify with
# `cargo tree -d | grep rustls`: no duplicate), with exactly the features
# hyper-rustls already turns on so nothing extra compiles.
reqwest = { version = "0.13", default-features = false, features = [
    "stream",
    "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
# Async file I/O for the same streaming path. Both are already in the tree under
# reqwest/hyper; naming them here only makes the dependency honest.
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "sync", "process", "time", "rt", "net"] }
tokio-util = { version = "0.7", default-features = false, features = ["io", "rt"] }

# Pinned relay: versions already in Cargo.lock, no extra TLS/crypto stack.
# HTTP streaming and websocket upgrade tunnel use the same HTTP/1 transport.
hyper = { version = "=1.10.1", features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http-body-util = "=0.1.3"
bytes = "=1.12.1"
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }

# The updater is desktop-only — gate it so mobile targets don't try to build it.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }

# Smart search (`semantic.rs`): llama.cpp statically linked, running the
# EmbeddingGemma 2 GGUF the user downloads. macOS only for now: B0 measured
# Apple silicon (Metal), and the Windows/Linux builds would ship without AVX2 or
# with a Vulkan loader the app cannot start without (B0-LLAMA-SPIKE.md §5).
#
# Pinned to utilityai/llama-cpp-rs PR #1175, which moves the bundled llama.cpp
# to v0.7.0: every crates.io release (0.1.160 and older) bundles a llama.cpp
# that rejects the `gemma-embedding2` architecture. A full commit SHA, so the
# fork cannot change under us. Move back to a crates.io version once #1175
# ships. Building it needs cmake (`brew install cmake`).
# `default-features = false`: the defaults pull OpenMP, which macOS has no
# system copy of. Metal is always on for macOS regardless of features.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { git = "https://github.com/willsheldon/llama-cpp-rs", rev = "cb98c630d0fec934a8a379db4fd63cd3622f6984", default-features = false, features = ["mtmd"] }

# The safe wrapper exposes neither mixed batches nor the encoded image buffer.
llama-cpp-sys-2 = { git = "https://github.com/willsheldon/llama-cpp-rs", rev = "cb98c630d0fec934a8a379db4fd63cd3622f6984", default-features = false, features = ["mtmd"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Com", "Win32_UI_Shell", "Win32_Security"] }

[dev-dependencies]
# Fresh test-only certificates; never store private fixture credentials.
rcgen = { version = "=0.14.5", default-features = false, features = ["crypto", "ring"] }
tempfile = "3"
# A current-thread runtime for the async transport tests (`attachments.rs`).
# Deliberately NOT the `macros` feature: `#[tokio::test]` would pull
# `tokio-macros` and a second `syn` into the lockfile for two tests that a
# three-line `block_on` helper covers.
tokio = { version = "1", features = ["rt"] }

# There is no workspace Cargo.toml above this crate, so this is the only place a
# release profile can go. Cargo's defaults build the shipped binary with no LTO
# and 16 codegen units; `tauri build` (both release workflows) picks this up
# automatically, no CI change.
#
# Deliberately NO `panic = "abort"`. This crate does `.lock().unwrap()`
# throughout and the process holds CRDT updates the bridge has not egested yet,
# so turning a poisoned-mutex panic into a process kill costs the user data;
# `rusqlite` also relies on `catch_unwind` in the callback paths (inert today,
# a landmine for whoever registers a custom collation or busy handler), and
# `cargo test --release` would stop supporting `#[should_panic]`. The win from
# abort is binary size, not startup latency.
[profile.release]
opt-level = 3
# "thin" rather than "fat": most of the win at a fraction of the link time, and
# a release links four targets. Measure before going fat.
lto = "thin"
codegen-units = 1
strip = true
